name: 노트북 점검

# ─────────────────────────────────────────────────────────────────────────────
# 레인 B — 노트북을 대역으로 실제 실행해 라이브러리 변경을 잡아낸다.
# 지금 등록된 것: 파이썬 기초 8개(I·II장) + III장 10개 + IV장 5개 + V장 6개 = 29개
#
# 정기 실행은 매달 1일 10:20 KST. 사람이 아무것도 하지 않아도 돈다.
# 수동 실행은 Actions 탭의 'Run workflow' 버튼 — 쓰임새는 셋이다.
#   1) 새 장을 점검 체계에 넣기 전에 한 번 돌려 보기
#   2) "코드가 안 돌아간다"는 제보를 받았을 때 눌러 보는 확인 버튼
#   3) 월간 점검이 빨간불일 때 같은 항목이 또 실패하는지 확인
#
# 저장소에는 아무것도 쓰지 않는다. 노트북 파일도 읽기만 한다.
# 레인 A와 달리 페이지(index.html)를 건드리지 않으므로 커밋이 발생하지 않는다.
#
# ⚠ 예약 실행은 저장소가 60일간 조용하면 자동으로 멈춘다.
#    레인 A가 매주 history.tsv 를 커밋하므로 저장소는 계속 깨어 있다.
#    레인 A를 끄면 레인 B도 함께 멈춘다는 뜻이다.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # UTC 매달 1일 01:20 = KST 매달 1일 10:20
    # 정각을 피한 것은 그 시각에 전 세계 작업이 몰려 대기가 길어지기 때문이다.
    - cron: "20 1 1 * *"
  workflow_dispatch:
    inputs:
      chapters:
        description: "점검할 장 (공백으로 구분). 예: 1 2 3 4 5 / 1 2 / 4 5"
        required: false
        default: "1 2 3 4 5"
      # 예약 실행에는 입력값이 없으므로 아래 기본값(1 2 3 4 5)이 그대로 쓰인다.
      run_probe:
        description: "구글시트 형식 확인을 함께 실행 (III장을 볼 때만 의미 있다)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  check:
    name: 노트북 대역 실행
    runs-on: ubuntu-latest
    # MNIST CNN이 러너(2코어)에서 오래 걸린다. 넉넉히 잡아 둔다.
    timeout-minutes: 60

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v7

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 선택 단계. 시트 형식은 이미 한 번 통과했으므로 기본값은 끔.
      - name: 구글시트 형식 확인
        if: ${{ github.event.inputs.run_probe == 'true' }}
        run: python tests/probe_gviz.py

      # 버전을 고정하지 않는다. 최신 라이브러리에서 깨지는지 보는 것이
      # 이 점검의 목적이기 때문이다.
      #
      # tensorflow 대신 tensorflow-cpu 를 쓴다. 러너에는 GPU가 없고,
      # 내려받는 용량이 절반 이하라 설치가 훨씬 빠르다. 코드에서 보이는 모습은 같다.
      # ipython 은 강화학습 노트북의 from IPython.display import HTML 때문에 필요하다.
      # matplotlib 은 seaborn 을 깔면 딸려 오지만, I-5-4가 직접 쓰므로 명시해 둔다.
      # VI장 이후를 점검할 때만 무거운 라이브러리(transformers·torch·gradio)를 깐다.
      # 지금 등록된 I~V장에는 필요 없고, 설치에만 몇 분이 더 걸리기 때문이다.
      - name: 무거운 라이브러리가 필요한가
        id: heavy
        run: |
          CH="${{ github.event.inputs.chapters || '1 2 3 4 5' }}"
          if echo "$CH" | grep -qE '(^| )(6|7|8|9)( |$)'; then
            echo "need=true" >> "$GITHUB_OUTPUT"
          else
            echo "need=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 실습용 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scikit-learn seaborn \
                      tensorflow-cpu gymnasium ipython

      - name: VI장 이후 라이브러리 설치
        if: steps.heavy.outputs.need == 'true'
        run: |
          pip install transformers sentencepiece accelerate gradio \
                      sentence-transformers \
                      torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: 설치된 버전 기록
        run: |
          {
            echo "## 실행 환경"
            echo ""
            echo '```'
            python - <<'PY'
          import sys
          print("python", sys.version.split()[0])
          for m in ["numpy", "pandas", "matplotlib", "sklearn", "tensorflow", "keras", "gymnasium", "seaborn"]:
              try:
                  mod = __import__(m)
                  print(m, getattr(mod, "__version__", "?"))
              except Exception as e:
                  print(m, "불러오기 실패:", type(e).__name__)
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --retry 1 : 실패한 노트북만 한 번 더 돌려 본다.
      # MNIST 내려받기나 구글시트 접속이 잠깐 흔들려 실패하는 일이 있는데,
      # 그때마다 실패 메일이 오면 사람은 곧 알림 자체를 믿지 않게 된다.
      # 다시 돌려 통과한 것은 Summary 에 '재시도 후 통과'로 남으니 묻히지 않는다.
      - name: 노트북 실행
        run: |
          python tests/run_chapters.py \
            --chapters ${{ github.event.inputs.chapters || '1 2 3 4 5' }} \
            --retry 1

      - name: 실패 시 읽을 것
        if: failure()
        run: |
          echo "::warning::점검이 실패했다. 아래 순서로 볼 것."
          echo "0. 이미 한 번 더 돌려 본 뒤의 결과다. 일시적인 접속 장애는 아닐 가능성이 높다."
          echo "1. Summary 탭의 표에서 어느 절이 ❌ 인지 먼저 확인한다."
          echo "2. '대역 오류'로 시작하면 prelude.py 문제다 (노트북 코드는 멀쩡하다)."
          echo "3. 역추적(Traceback)이 찍혀 있으면 노트북 코드 또는 라이브러리 변경 문제다."
          echo "   맨 아랫줄의 오류 이름과 파일 이름을 보면 어느 라이브러리인지 드러난다."
          echo "4. 📏(측정)은 실패가 아니다. 값만 재서 보고한 것이다."
          echo "5. 그래도 판단이 안 서면 Run workflow 로 그 장만 다시 돌려 본다."
          echo "   예: chapters 칸에 4 만 넣기."

      - name: 성공 시 안내
        if: success()
        run: |
          echo "::notice::점검을 마쳤다."
          echo "Summary 탭에서 볼 것: 📏(측정) 값, 그리고 '재시도 후 통과'가 있는지."
          echo "같은 노트북이 두 달 연속 재시도에 걸리면 일시 장애가 아니라 진짜 문제다."
