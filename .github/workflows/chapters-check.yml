name: 노트북 점검

# ─────────────────────────────────────────────────────────────────────────────
# 레인 B — 노트북을 대역으로 실제 실행해 라이브러리 변경을 잡아낸다.
# 등록 목록은 tests/run_chapters.py 의 CASES 가 유일한 출처다.
# 실행하면 맨 앞줄에 "점검 대상: N개"가 찍힌다. 여기에 숫자를 옮겨 적지 말 것 —
# 옮겨 적은 숫자는 목록이 늘어나도 따라오지 않아 조용히 거짓말이 된다.
#
# 정기 실행은 매달 1일 10:20 KST. 사람이 아무것도 하지 않아도 돈다.
# 수동 실행은 Actions 탭의 'Run workflow' 버튼 — 쓰임새는 셋이다.
#   1) 새 장을 점검 체계에 넣기 전에 한 번 돌려 보기
#   2) "코드가 안 돌아간다"는 제보를 받았을 때 눌러 보는 확인 버튼
#   3) 월간 점검이 빨간불일 때 같은 항목이 또 실패하는지 확인
#
# 저장소에는 아무것도 쓰지 않는다. 노트북 파일도 읽기만 한다.
# 레인 A와 달리 페이지(index.html)를 건드리지 않으므로 커밋이 발생하지 않는다.
#
# ⚠ 예약 실행은 저장소가 60일간 조용하면 자동으로 멈춘다.
#    레인 A가 매주 history.tsv 를 커밋하므로 저장소는 계속 깨어 있다.
#    레인 A를 끄면 레인 B도 함께 멈춘다는 뜻이다.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # UTC 매달 1일 01:20 = KST 매달 1일 10:20
    # 정각을 피한 것은 그 시각에 전 세계 작업이 몰려 대기가 길어지기 때문이다.
    - cron: "20 1 1 * *"
  workflow_dispatch:
    inputs:
      chapters:
        description: "점검할 장 (공백으로 구분). 예: 1 2 3 4 5 6 7 9 / 1 2 / 9"
        required: false
        default: "1 2 3 4 5 6 7 9"
      # ⚠ 이 default 는 **버튼을 눌렀을 때 칸에 채워지는 값**일 뿐이다.
      #   예약 실행에는 입력값이 아예 없으므로 아래 jobs.check.env.CHAPTERS 의
      #   기본값이 쓰인다. 장 목록을 바꿀 때는 두 곳을 함께 고칠 것.
      #   한 곳만 고치면 버튼에는 6장이 보이는데 매달 도는 것은 1~5장인,
      #   초록불이 뜨는 조용한 어긋남이 된다.
      run_probe:
        description: "구글시트 형식 확인을 함께 실행 (III장을 볼 때만 의미 있다)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  check:
    name: 노트북 대역 실행
    runs-on: ubuntu-latest
    # 2026-08-20 전체 실행(1~9장 46개) 실측으로 잡은 시간 예산 (제한 60분)
    #   노트북 합계 12.2 ~ 16.9분. 여기에 무거운 라이브러리 설치가 더 붙는다.
    # ⚠ 두 편이 시간을 정한다.
    #   VI-8 _str  : 205 ~ 351초 (최악값이 338 → 343 → 347 → 351 로 계속 오른다)
    #   IX-3       : 4 ~ 241초 (원인 미상 — CASES 의 IX-3 note 참조)
    #   16.9분짜리 실행에서 이 둘이 합쳐 10분이었다.
    # ⚠ 같은 코드가 러너 상태에 따라 71%까지 차이 난다(VI-8 _str 기준).
    #    시간 판단은 항상 최악값으로 할 것.
    #    짧은 노트북도 예외가 아니다 — V-1 은 2초 ~ 18초, VII-3② 는 3초 ~ 7초로 갈렸다.
    timeout-minutes: 60

    env:
      # 점검할 장을 정하는 자리는 여기 하나뿐이다.
      # 예약 실행에는 입력값이 없으므로 오른쪽 기본값이 그대로 쓰인다.
      # (위 workflow_dispatch 의 default 는 버튼 칸을 채우는 값일 뿐이다)
      # ⚠ 8이 빠진 것은 실수가 아니다. VIII장은 등록 대상이 0개다
      #   (노트북 둘 다 의도적 제외 — 사유는 run_chapters.py 의 VIII장 주석 참조).
      #   목록에 8을 넣으면 "8장도 점검했다"고 읽히지만 실제로는 도는 것이 없다.
      CHAPTERS: ${{ github.event.inputs.chapters || '1 2 3 4 5 6 7 9' }}

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v7

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 선택 단계. 시트 형식은 이미 한 번 통과했으므로 기본값은 끔.
      - name: 구글시트 형식 확인
        if: ${{ github.event.inputs.run_probe == 'true' }}
        run: python tests/probe_gviz.py

      # 버전을 고정하지 않는다. 최신 라이브러리에서 깨지는지 보는 것이
      # 이 점검의 목적이기 때문이다.
      #
      # tensorflow 대신 tensorflow-cpu 를 쓴다. 러너에는 GPU가 없고,
      # 내려받는 용량이 절반 이하라 설치가 훨씬 빠르다. 코드에서 보이는 모습은 같다.
      # ipython 은 강화학습 노트북의 from IPython.display import HTML 때문에 필요하다.
      # matplotlib 은 seaborn 을 깔면 딸려 오지만, I-5-4가 직접 쓰므로 명시해 둔다.
      # VI장 이후를 점검할 때만 무거운 라이브러리(transformers·torch·gradio)를 깐다.
      # I~V장에는 필요 없고, 설치에만 몇 분이 더 걸리기 때문이다.
      #
      # bertviz 는 VI-9 'NLP_Transformer with BertViz' 가 쓴다. 노트북의 !pip 줄은
      # 러너가 지우므로 여기에 없으면 그 노트북이 import 에서 곧바로 죽는다.
      # bertviz 의 의존성(transformers·torch·IPython·boto3 등)은 전부 하한선만 있고
      # 천장이 없어서, "최신에서 깨지는지 본다"는 이 점검의 방침을 방해하지 않는다.
      #
      # ipywidgets 는 VI-8 'NLP_Attention_arrows' 가 쓴다(드롭다운 UI).
      # 이 노트북에는 !pip 줄이 아예 없다 — Colab 기본 제공에 기대고 있기 때문인데,
      # 러너에는 기본 제공이 없으므로 여기서 깔아 준다.
      # VII-1 'Generative AI_Text Generator' 도 같은 처지다(!pip 줄이 없다).
      #
      # gTTS·librosa 는 VII-3② 'Generative AI_Voice' 가 쓴다.
      # ⚠ 반드시 아래 **같은 pip 명령 안**에 둘 것. 따로 깔면 gTTS 가 click 을
      #    끌어내려 huggingface-hub 가 조용히 망가진다. 노트북 저장 출력에 그 경고가
      #    그대로 남아 있다 — "huggingface-hub requires click>=8.4.2,
      #    but you have click 8.1.8". VI장 14개가 전부 huggingface-hub 에 기대므로
      #    이 오염은 VII장이 아니라 VI장을 무너뜨린다.
      #    한 명령에 넣어야 해석기가 모든 제약을 한 번에 보고 맞는 조합을 고른다.
      # mp3 디코딩에는 별도 설치가 필요 없다. soundfile 이 품고 오는
      # libsndfile 1.2.2 가 MP3 를 지원한다 (2026-08-20 실측). ffmpeg 는 필요 없다.
      #
      # VII-2 Diffusion(diffusers) 과 VII-3① Music 은 레인 B 제외 대상이라 깔지 않는다.
      # 두 노트북의 고정 판번호는 레인 A 가 PyPI 로 감시한다
      # (pypi-diffusers-0-39-0 · pypi-accelerate-1-14-0 등).
      - name: 무거운 라이브러리가 필요한가
        id: heavy
        run: |
          if echo "$CHAPTERS" | grep -qE '(^| )(6|7|8|9)( |$)'; then
            echo "need=true" >> "$GITHUB_OUTPUT"
          else
            echo "need=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 실습용 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scikit-learn seaborn \
                      tensorflow-cpu gymnasium ipython

      - name: VI장 이후 라이브러리 설치
        if: steps.heavy.outputs.need == 'true'
        run: |
          pip install transformers sentencepiece accelerate gradio \
                      sentence-transformers bertviz ipywidgets \
                      librosa \
                      torch --extra-index-url https://download.pytorch.org/whl/cpu

          # gTTS 만 따로, 그것도 --no-deps 로 깐다.
          #
          # gTTS 2.5.4 는 click<8.2 를, huggingface-hub 1.27+ 는 click>=8.4.2 를 요구한다.
          # 겹치는 구간이 없어서 pip 는 둘 중 하나를 포기해야 하는데,
          # 한 명령에 넣으면 **huggingface-hub 쪽을 낮춘다** — 1.28.0 대신 1.16.1 이 깔린다
          # (2026-08-21 실측). 그러면 러너가 '최신에서 깨지는지 미리 본다'는 목적을
          # 하필 모델 내려받기 경로 전체를 담당하는 huggingface-hub 에서만 잃는다.
          #
          # --no-deps 가 안전한 근거: gtts/__init__.py 는 .version 과 .tts 만 부르고
          # click 은 gtts/cli.py(명령줄 도구)에만 있다. 노트북이 쓰는
          # `from gtts import gTTS` 는 click 없이 동작한다.
          # 나머지 의존인 requests 는 transformers 가 이미 깔아 둔다.
          #
          # ⚠ 독자의 노트북은 반대다. VII-3② 는 `!pip install gTTS==2.5.4 librosa==0.11.0`
          #   한 명령 그대로 두고 --no-deps 를 쓰지 않는다. 독자는 세션이 노트북마다
          #   따로라 huggingface-hub 가 낮아져도 그 세션 안에서 끝나고,
          #   빨간 경고 글씨는 나오지만 그것뿐이다.
          pip install --no-deps gTTS

      # VI장 이후를 돌 때는 무거운 라이브러리의 판번호도 함께 남긴다.
      # 노트북에는 판번호가 박혀 있지만 러너는 그 !pip 줄을 지우고 최신판으로 돌린다.
      # 그래서 VI장 빨간불은 "독자가 지금 못 쓴다"가 아니라 "고정을 풀면 깨진다"는 뜻인데,
      # 그 뜻을 읽으려면 **어느 판번호에서 깨졌는지**를 알아야 한다.
      # 매달 쌓이는 이 기록은 개정판 때 고정값을 재조사할 자료가 되기도 한다.
      - name: 설치된 버전 기록
        env:
          HEAVY: ${{ steps.heavy.outputs.need }}
        run: |
          {
            echo "## 실행 환경"
            echo ""
            echo '```'
            python - <<'PY'
          import os, sys
          print("python", sys.version.split()[0])

          def ver(name):
              try:
                  mod = __import__(name)
              except Exception as e:
                  return "불러오기 실패: " + type(e).__name__
              v = getattr(mod, "__version__", None)
              if v:
                  return v
              # bertviz 처럼 __version__ 을 두지 않는 패키지가 있다.
              try:
                  import importlib.metadata as md
                  return md.version(name.replace("_", "-"))
              except Exception:
                  return "?"

          mods = ["numpy", "pandas", "matplotlib", "sklearn",
                  "tensorflow", "keras", "gymnasium", "seaborn"]
          if os.getenv("HEAVY") == "true":
              # huggingface_hub 은 노트북이 직접 import 하지 않지만 반드시 남긴다.
              # transformers 의 모델 내려받기가 전부 이 패키지를 지나가는데,
              # 목록에 없던 동안 gTTS 때문에 11판 낮은 것이 깔려 있어도 아무도 몰랐다.
              mods += ["torch", "transformers", "huggingface_hub",
                       "sentencepiece", "accelerate",
                       "gradio", "sentence_transformers", "bertviz",
                       "ipywidgets", "gtts", "librosa"]
          for m in mods:
              print(m, ver(m))
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --retry 1 : 실패한 노트북만 한 번 더 돌려 본다.
      # MNIST 내려받기나 구글시트 접속이 잠깐 흔들려 실패하는 일이 있는데,
      # 그때마다 실패 메일이 오면 사람은 곧 알림 자체를 믿지 않게 된다.
      # 다시 돌려 통과한 것은 Summary 에 '재시도 후 통과'로 남으니 묻히지 않는다.
      - name: 노트북 실행
        run: |
          python tests/run_chapters.py \
            --chapters $CHAPTERS \
            --retry 1

      - name: 실패 시 읽을 것
        if: failure()
        run: |
          echo "::warning::점검이 실패했다. 아래 순서로 볼 것."
          echo "0. 이미 한 번 더 돌려 본 뒤의 결과다. 일시적인 접속 장애는 아닐 가능성이 높다."
          echo "1. Summary 탭의 표에서 어느 절이 ❌ 인지 먼저 확인한다."
          echo "2. '대역 오류'로 시작하면 prelude.py 문제다 (노트북 코드는 멀쩡하다)."
          echo "3. 역추적(Traceback)이 찍혀 있으면 노트북 코드 또는 라이브러리 변경 문제다."
          echo "   맨 아랫줄의 오류 이름과 파일 이름을 보면 어느 라이브러리인지 드러난다."
          echo "4. 📏(측정)은 실패가 아니다. 값만 재서 보고한 것이다."
          echo "5. 그래도 판단이 안 서면 Run workflow 로 그 장만 다시 돌려 본다."
          echo "   예: chapters 칸에 4 만 넣기."

      - name: 성공 시 안내
        if: success()
        run: |
          echo "::notice::점검을 마쳤다."
          echo "Summary 탭에서 볼 것: 📏(측정) 값, 그리고 '재시도 후 통과'가 있는지."
          echo "같은 노트북이 두 달 연속 재시도에 걸리면 일시 장애가 아니라 진짜 문제다."
